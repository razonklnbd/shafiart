<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <!-- Artistic S & Canvas Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base Rounded Square -->
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="3"/>

  <!-- Crop / Canvas Frame Corner Accents -->
  <path d="M 32 44 V 36 A 4 4 0 0 1 36 32 H 44" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 96 44 V 36 A 4 4 0 0 0 92 32 H 84" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 32 84 V 92 A 4 4 0 0 0 36 96 H 44" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 96 84 V 92 A 4 4 0 0 1 92 96 H 84" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Stylized Artistic "S" for Shafia / Shafiart -->
  <path d="M 76 40 C 66 36 50 38 45 46 C 40 54 52 62 64 66 C 76 70 88 76 83 86 C 78 96 60 96 48 90" 
        fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Creative Brush / Sparkle Dot -->
  <circle cx="86" cy="84" r="5" fill="#f59e0b"/>
</svg>
