<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base Container -->
  <rect x="12" y="12" width="104" height="104" rx="26" ry="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Inner Image / Canvas Frame -->
  <rect x="36" y="36" width="56" height="56" rx="8" fill="none" stroke="url(#canvasGrad)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Crop / Selection Corner Brackets (Representing Editing & Cropping) -->
  <path d="M 28 48 V 28 H 48" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 100 48 V 28 H 80" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 28 80 V 100 H 48" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 100 80 V 100 H 80" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Active Editing Tool / Brush Point Accent -->
  <circle cx="64" cy="64" r="8" fill="#f59e0b"/>
</svg>
